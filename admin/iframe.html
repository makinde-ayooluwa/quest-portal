<header style="padding: 60px;background-color: red;">Header</header>
<form action="search_handler.php">
    <input type="text" name="query">
    <input type="submit" value="Submit">
</form>
<style>
    .info-card {
        width: 250px;
        min-height: 120px;
        background-color: lightgrey;
        border: 1px solid black;
        padding: 10px;
        box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
        position: absolute;
        z-index: 1000;
        display: none;
    }
    .highlight {
        border: 3px solid blue !important;
        box-shadow: 0 0 10px rgba(0, 0, 255, 0.5) !important;
    }
    .next-btn {
        margin-top: 10px;
        padding: 5px 10px;
        background-color: blue;
        color: white;
        border: none;
        cursor: pointer;
    }
</style>

<script>
    function sections() {

        return (
            [
                //Sections
                {
                    "title": "Global Search Bar",
                    "functions": [
                        "Search for student, staffs, classes etc"
                    ],
                    "parent": document.querySelector("header"),
                    "parentLocation": document.querySelector("header").getBoundingClientRect()
                },
                {
                    "title": "Search Form",
                    "functions": [
                        "Input search query and submit to search_handler.php"
                    ],
                    "parent": document.querySelector("form"),
                    "parentLocation": document.querySelector("form").getBoundingClientRect()
                },
                {
                    "title": "Search Input",
                    "functions": [
                        "Input field for search query"
                    ],
                    "parent": document.querySelector("input[name='query']"),
                    "parentLocation": document.querySelector("input[name='query']").getBoundingClientRect()
                },
                {
                    "title": "Submit Button",
                    "functions": [
                        "Submit the search form"
                    ],
                    "parent": document.querySelector("input[type='submit']"),
                    "parentLocation": document.querySelector("input[type='submit']").getBoundingClientRect()
                }
            ]
        )

    }

    console.log(sections());

    function displayCard(index) {
        let section = sections()[index];
        let card = document.createElement("div");
        card.className = "info-card";
        card.id = "info-card-" + index;
        card.style.top = (section.parentLocation.top + section.parentLocation.height + 10) + "px";
        card.style.left = section.parentLocation.left + "px";

        let title = document.createElement("h3");
        title.innerText = section.title;
        card.appendChild(title);

        let funcList = document.createElement("ul");
        for(j = 0; j < section.functions.length; j++) {
            let funcItem = document.createElement("li");
            funcItem.innerText = section.functions[j];
            funcList.appendChild(funcItem);
        }
        card.appendChild(funcList);

        let nextBtn = document.createElement("button");
        nextBtn.className = "next-btn";
        nextBtn.innerText = "Next";
        nextBtn.onclick = function() { nextIntro(); };
        card.appendChild(nextBtn);

        document.body.appendChild(card);
        card.style.display = "block";
    }
    let currentIntroIndex = 0;
    let introTimeout;

    function introduce() {
        if (currentIntroIndex < sections().length) {
            // Highlight the current section
            let section = sections()[currentIntroIndex];
            section.parent.classList.add("highlight");

            // Display the card
            displayCard(currentIntroIndex);

            // Auto-advance after 3 seconds
            introTimeout = setTimeout(function() {
                nextIntro();
            }, 3000);
        } else {
            // Intro finished, remove highlights
            sections().forEach(function(sec) {
                sec.parent.classList.remove("highlight");
            });
        }
    }

    function nextIntro() {
        // Clear timeout
        clearTimeout(introTimeout);

        // Remove highlight from current section
        if (currentIntroIndex < sections().length) {
            sections()[currentIntroIndex].parent.classList.remove("highlight");
        }

        // Hide current card
        let currentCard = document.getElementById("info-card-" + currentIntroIndex);
        if (currentCard) {
            currentCard.style.display = "none";
        }

        // Move to next
        currentIntroIndex++;
        introduce();
    }
    document.addEventListener("DOMContentLoaded", function () {
        introduce();
    })
</script>
