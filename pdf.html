<script>
    document.getElementById('downloadLoginPdfBtn').addEventListener('click', function () {
        const loginCard = document.querySelector('.form-container');
        html2pdf().set({
            margin: 0.5,
            filename: 'login_page.pdf',
            image: {
                type: 'jpeg',
                quality: 0.98
            },
            html2canvas: {
                scale: 2
            },
            jsPDF: {
                unit: 'in',
                format: 'a4',
                orientation: 'portrait'
            }
        }).from(loginCard).save();
    });
</script>
</body>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Download Example</title>
    <!-- Bootstrap for styling (optional) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: #f8f9fa;
        }

        .video-container {
            max-width: 600px;
            margin: 3rem auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
            padding: 2rem;
        }

        .btn-grad {
            background: linear-gradient(90deg, #0d6efd 60%, #198754 100%);
            border: none;
        }
    </style>
</head>

<body>
    <div class="video-container">
        <h2 class="mb-4 text-center">Download Video</h2>
        <video id="sampleVideo" width="100%" controls>
            <source src="assets/videos/sample.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="text-center mt-4">
            <a href="https://www.youtube.com/watch?v=PCUwou5Cg7g" download class="btn btn-grad text-white">
                <i class="bi bi-download me-2"></i>Download This Video
            </a>
        </div>
    </div>
</body>

</html>
